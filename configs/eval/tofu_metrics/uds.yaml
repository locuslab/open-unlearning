# @package eval.tofu.metrics.uds
defaults:
  - ../../data/datasets@datasets: UDS_annotated_TOFU_forget10
  - ../../collator@collators: DataCollatorForSupervisedDatasetwithIndex

handler: uds
batch_size: ${eval.tofu.batch_size}
# must match the evaluated model, e.g. open-unlearning/tofu_Llama-3.1-8B-Instruct_{full,retain90}
full_model_path: open-unlearning/tofu_Llama-3.2-1B-Instruct_full
retain_model_path: open-unlearning/tofu_Llama-3.2-1B-Instruct_retain90
delta_threshold: 0.05 # min log-prob drop for a knowledge-encoding layer
