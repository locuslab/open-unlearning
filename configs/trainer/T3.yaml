defaults:
  - finetune

handler: T3

args:
  learning_rate: 5e-2
  weight_decay: 0.0
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  do_eval: false
  eval_on_start: false
  eval_strategy: "no"
  save_strategy: "no"
  report_to: none

method_args:
  pooling: mean
  pool_temp: null
  extraction_layer: -1
  guidance_scale: 1
  base_temp: 1
  guidance_cfg:
    hidden_size: 100
    num_hidden_layers: 1
    activation_str: id
    bias: false
