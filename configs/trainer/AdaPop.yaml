defaults:
  - finetune

handler: AdaPop

args: # HuggingFace TrainingArguments
  learning_rate: 1e-5
  num_train_epochs: 5

method_args:
  use_popularity: false # false: every fact gets default_popularity; true: read popularity from the forget data (set popularity_key)
  default_popularity: 100.0
  beta_a: 58.7 # beta_i = clip(beta_a * popularity_i^(-beta_b), 0.05, 2.0)
  beta_b: 0.796
  beta_const: null # set to use one beta for all facts (plain WGA)
  gamma: 1.0
  gamma_warmup_epochs: 0.0
  alpha0: 0.5
  alpha_const: null # set to fix the retain weight and disable the dual update
  eps: 0.1
  dual_lr: 0.1
  lambda_max: 5.0
  retain_ema_decay: 0.9
  retain_loss_type: NLL
